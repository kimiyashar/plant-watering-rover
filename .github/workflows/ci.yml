name: C++ tests

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and run tests
        run: make test

      - name: Build simulator
        run: make

      - name: Run sample simulation
        run: ./rover_sim simulated_camera_data.csv 2
